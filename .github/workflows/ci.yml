name: CI

on:
  push:
  pull_request:

jobs:
  full-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # uv reads the pinned interpreter from .python-version automatically,
      # installing it if it isn't already available on the runner.
      - name: Sync dependencies
        run: uv sync

      - name: Run full check (lint + typecheck + test)
        run: make full-check
