[project]
name = "open-harness-router"
version = "0.1.0"
description = "Anthropic-compatible routing proxy for Claude Code CLI"
requires-python = "==3.13.*"
license = { text = "MIT" }
authors = [
    { name = "kskadart", email = "120260513+kskadart@users.noreply.github.com" },
]
dependencies = [
    "cryptography==50.0.0",
    "fastapi==0.139.0",
    "h11==0.16.0",
    "httpx==0.28.1",
    "openai==2.45.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "uvicorn[standard]==0.51.0",
]

[dependency-groups]
dev = [
    "mypy==2.2.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-httpx==0.36.2",
    "ruff==0.15.21",
    "types-pyyaml==6.0.12.20260518",
]

[project.urls]
Homepage = "https://github.com/kskadart/open-harness-router"
Repository = "https://github.com/kskadart/open-harness-router"

[tool.uv]
package = false

[tool.pyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PL", "RET"]
ignore = ["PLR2004", "PLR0913", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

# Ported converters: the code is verified at runtime, but mypy doesn't
# narrow the content-block union the way `block.type == "..."` comparisons
# do. Disable this narrow set of codes only for this module; the rest of
# the code stays under strict.
[[tool.mypy.overrides]]
module = "conversion.*"
disable_error_code = ["union-attr", "no-any-return", "assignment"]
