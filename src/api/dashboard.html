<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>open-harness-router</title>
<!-- A loud tab icon (a route forking in two on a pink-to-orange square), inline
     so it needs no extra file and stands out among the open tabs. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff2d75'/%3E%3Cstop offset='1' stop-color='%23ff9f1a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M5 16h9l6-7h7M14 16l6 7h7' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/dashboard/static/app.css">
<!-- The bare specifiers the module graph uses; the vendored files are served
     from the same origin, so the page never reaches a CDN at runtime. -->
<script type="importmap">
{"imports": {
  "preact": "/dashboard/static/vendor/preact.mjs",
  "preact/hooks": "/dashboard/static/vendor/preact-hooks.mjs",
  "htm": "/dashboard/static/vendor/htm.mjs"
}}
</script>
<script src="/dashboard/static/vendor/chart.umd.min.js"></script>
</head>
<body>
<div id="app" data-state-url="/dashboard/state"></div>
<script type="module" src="/dashboard/static/app.js"></script>
</body>
</html>
