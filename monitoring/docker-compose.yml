# Prometheus + Grafana for open-harness-router, scraping GET /metrics on the
# router's ASGI listener (host port 8787 by default).
#
#   cd monitoring && docker compose up -d
#   open http://127.0.0.1:3000   (admin / admin, change on first login)
#
# The router runs on the host, not in a container, so Prometheus reaches it
# through host.docker.internal (Docker Desktop on macOS/Windows; on Linux the
# extra_hosts line below maps it to the host gateway). Both services bind to
# the loopback interface only. Data lives in named volumes; `docker compose
# down -v` removes them.
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ohr-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    container_name: ohr-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
