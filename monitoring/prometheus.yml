# Scrape the router's /metrics every 5 seconds. Change the target port if
# ROUTER_SERVER_PORT is not 8787.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: open-harness-router
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8787"]
